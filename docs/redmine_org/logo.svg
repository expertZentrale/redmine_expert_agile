<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- expert Agile – redmine.org plugin directory logo (sibling of the helpdesk logo) -->
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- faint expert-star watermark, striped like the helpdesk sibling -->
  <g fill="#F04C00" opacity="0.05">
    <polygon points="50,2 88,68 12,68"/>
    <polygon points="50,74 12,8 88,8"/>
  </g>
  <g fill="#ffffff">
    <rect x="0" y="12" width="100" height="2.4"/>
    <rect x="0" y="24" width="100" height="2.4"/>
    <rect x="0" y="36" width="100" height="2.4"/>
    <rect x="0" y="48" width="100" height="2.4"/>
    <rect x="0" y="60" width="100" height="2.4"/>
  </g>

  <!-- circle ring -->
  <circle cx="50" cy="38" r="26.5" fill="#ffffff" stroke="#F04C00" stroke-width="2.6"/>

  <!-- red segmented arc (family element) -->
  <path d="M 32.5 25.5 A 21.5 21.5 0 0 1 67.5 25.5"
        fill="none" stroke="#CD291F" stroke-width="5.4"
        stroke-dasharray="6.2 2.55"/>

  <!-- kanban board -->
  <g>
    <rect x="29" y="29" width="42" height="27" rx="3.4" fill="#F04C00"/>
    <!-- three columns -->
    <rect x="32.4" y="32.4" width="10.4" height="20.2" rx="1.6" fill="#ffffff"/>
    <rect x="44.8" y="32.4" width="10.4" height="20.2" rx="1.6" fill="#ffffff"/>
    <rect x="57.2" y="32.4" width="10.4" height="20.2" rx="1.6" fill="#ffffff"/>
    <!-- cards: backlog full, doing two, done one -->
    <rect x="33.8" y="34.0" width="7.6" height="4.6" rx="1.1" fill="#CD291F"/>
    <rect x="33.8" y="39.8" width="7.6" height="4.6" rx="1.1" fill="#F58C66"/>
    <rect x="33.8" y="45.6" width="7.6" height="4.6" rx="1.1" fill="#F58C66"/>
    <rect x="46.2" y="34.0" width="7.6" height="4.6" rx="1.1" fill="#CD291F"/>
    <rect x="46.2" y="39.8" width="7.6" height="4.6" rx="1.1" fill="#F58C66"/>
    <!-- done column: card with white expert-x on red -->
    <rect x="58.6" y="34.0" width="7.6" height="4.6" rx="1.1" fill="#CD291F"/>
    <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
      <line x1="60.9" y1="35.1" x2="64.0" y2="38.2"/>
      <line x1="64.0" y1="35.1" x2="60.9" y2="38.2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="50" y="78.5" text-anchor="middle" font-family="Nunito, sans-serif"
        font-weight="900" font-size="14.5" fill="#EE4100">expert</text>
  <text x="50" y="90" text-anchor="middle" font-family="Nunito, sans-serif"
        font-weight="800" font-size="11" fill="#3F4245">Agile</text>
  <text x="50" y="96.2" text-anchor="middle" font-family="Nunito, sans-serif"
        font-weight="800" font-size="4.6" letter-spacing="0.5">
    <tspan fill="#525557">for </tspan><tspan fill="#CD291F">Redmine</tspan>
  </text>
</svg>
